<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PEC 2 - Visualización de datos (M2.859)</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 720px;
            margin: 40px auto;
            padding: 0 20px;
            color: #222;
        }
        h1 {
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }
        ul {
            list-style: none;
            padding: 0;
            padding-top: 8px;
        }
        li {
            margin: 8px 0;
            padding: 20px 16px;
            background: #f6f8fa;
            border-radius: 6px;
            transition: background 0.2s;
        }
        li:hover { background: #e9eef3; }
        a {
            display: block;
            text-decoration: none;
            color: #0969da;
            font-weight: 500;
            margin-bottom: 4px;
        }
        a:hover { text-decoration: underline; }
        .desc {
            display: block;
            color: #666;
            font-size: 0.9em;
            margin-left: 0;
        }
        li img {
            display: block;
            max-width: 100%;
            height: auto;
            margin-top: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>PEC 2 - Visualización de datos (M2.859)</h1>
    <ul>
        <li>
            <a href="images/pyramid-chart.png" target="_blank">GRUPO I - Técnicas básicas y populares</a>
            <span class="desc">Pyramid Chart</span>
            <img src="images/pyramid-chart.png" alt="Pyramid Chart">
        </li>
        <li>
            <a href="images/boxplot.png" target="_blank">GRUPO II - Técnicas habituales y específicas</a>
            <span class="desc">Boxplot</span>
            <img src="images/boxplot.png" alt="Boxplot">
        </li>
        <li>
            <a href="images/ohlc.png" target="_blank">GRUPO III - Técnicas menos habituales o más específicas</a>
            <span class="desc">OHLC Chart</span>
            <img src="images/ohlc.png" alt="OHLC Chart">
        </li>
    </ul>
</body>
</html>
